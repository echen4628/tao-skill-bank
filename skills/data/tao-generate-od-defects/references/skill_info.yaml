network_arch: tao-generate-od-defects
type: data
container_image: nvcr.io/nvidia/paidf-anomalygen:1.1.0  # versions-key: images.metropolis_sdg.anomalygen_next
execution_environment: container
gpu_spec_key: num_gpus
required_credentials: []
optional_credentials:
- name: HF_TOKEN
  source: env_var
  only_when: generation must fetch a missing gated HuggingFace asset
- name: NGC_KEY
  source: env_var
  only_when: the selected platform requires authenticated access to nvcr.io
actions:
  generate:
    command: scripts/generate_od_defects.sh
    mode: args
    inputs:
      prepared_inputs_root:
        type: folder
      base_checkpoint:
        type: folder
      pipeline_py:
        type: file
        optional: true
      hf_cache:
        type: folder
        optional: true
    outputs:
      results_dir:
        type: folder
      validation_summary:
        type: file
      native_coco:
        type: file
      binary_coco:
        type: file
      status:
        type: file
    upload_excludes:
    - inputs/
    args:
      inputs_dir: --inputs-dir {prepared_inputs_root}
      output_dir: --output-dir {results_dir}
      datasets: --datasets {datasets}
      num_gpus: --num-gpus {num_gpus}
      base_checkpoint: --base-checkpoint {base_checkpoint}
      pipeline_py: --pipeline-py {pipeline_py}
      hf_cache: --hf-cache {hf_cache}
      job_id: --job-id {job_id}
    defaults:
      num_gpus: 1
      pipeline_py: scripts/generate_od_defects.py
