network_arch: tao-generate-od-defects
type: data
# AnomalyGenNext is supplied as an external checkout plus virtualenv. There is
# no bank-owned container image to resolve; record the selected interpreter
# path as the job image when this action runs through a native platform.
execution_environment: virtualenv
gpu_spec_key: num_gpus
required_credentials: []
optional_credentials:
- name: HF_TOKEN
  source: env_var
  only_when: generation must fetch a missing gated HuggingFace asset
actions:
  generate:
    command: scripts/generate_od_defects.sh
    mode: args
    inputs:
      prepared_inputs_root:
        type: folder
      anomalygen_repo:
        type: folder
      base_checkpoint:
        type: folder
      anomalygen_activate:
        type: file
        optional: true
      anomalygen_python:
        type: file
        optional: true
      uv_bin_dir:
        type: folder
        optional: true
      pipeline_py:
        type: file
        optional: true
      hf_cache:
        type: folder
        optional: true
    outputs:
      results_dir:
        type: folder
      validation_summary:
        type: file
      native_coco:
        type: file
      binary_coco:
        type: file
      status:
        type: file
    upload_excludes:
    - inputs/
    args:
      inputs_dir: --inputs-dir {prepared_inputs_root}
      output_dir: --output-dir {results_dir}
      datasets: --datasets {datasets}
      num_gpus: --num-gpus {num_gpus}
      anomalygen_repo: --anomalygen-repo {anomalygen_repo}
      activate: --activate {anomalygen_activate}
      python: --python {anomalygen_python}
      base_checkpoint: --base-checkpoint {base_checkpoint}
      uv_bin_dir: --uv-bin-dir {uv_bin_dir}
      pipeline_py: --pipeline-py {pipeline_py}
      hf_cache: --hf-cache {hf_cache}
      job_id: --job-id {job_id}
    defaults:
      num_gpus: 1
      pipeline_py: scripts/generate_od_defects.py
