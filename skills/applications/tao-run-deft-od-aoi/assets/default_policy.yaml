class_name: defect
max_iterations: null
platform: null
reproduction_mode: true_fresh
base_checkpoint: null
routing_seed_checkpoint: null
model:
  backend: rtdetr
  architecture: rtdetr
sources:
  kpi: {images: null, coco: null}
  test: {images: null, coco: null}
  real: {images: null, coco: null}
  clean: {images: null, coco: null}
gap:
  inference_confidence: 0.001
  loose_confidence: 0.3
  strict_confidence: 0.8
  match_iou: 0.5
  background_iou_upper: 0.05
  near_miss_iou_upper: 0.5
retrieval:
  mode: siglip_only
  model: SigLIP
  model_path: google/siglip-base-patch16-224
  defect_context_scale: 1.5
  clean_grids: [1, 2]
  minimum_similarity: -1.0
  candidate_overfetch: 15
  output_size: 224
  audit_top_k_per_query: 20
routing:
  adaptive_conversion_prior: 0.33
  real_mine_factor_min: 1
  real_mine_factor_max: 6
  near_miss_real_factor: 2
  near_miss_real_cap_per_pocket: 20
  clean_factor: 2
  clean_cumulative_cap_per_real: 1.0
  uniform_mine: {mode: constant, per_pocket: 0}
admission:
  duplicate_global_cosine: 0.995
  duplicate_defect_cosine: 0.985
  duplicate_position_delta: 0.04
  clean_duplicate_global_cosine: 0.999
  clean_cluster_cosine: 0.97
  clean_cluster_minimum_cap: 2
  clean_cluster_quota_divisor: 4
  minimum_box_area_px: 64
  maximum_box_aspect: 25.0
  duplicate_gt_iou: 0.9
training:
  num_gpus: 4
  batch_size: 8
  base_lr: 0.0001
  backbone_lr: 0.00001
  early_iterations_epochs: 36
  adaptive_reference_images: 10000
  adaptive_min_epochs: 24
  adaptive_max_epochs: 48
  probes_enabled: true
  probe_start_iteration: 3
  probe_epochs: 10
  workers: 4
  checkpoint_interval: 1
  validation_interval: 1
  growth_high: 1.25
  growth_low: 0.9
  high_growth_lr_factor: 1.15
  low_growth_lr_factor: 0.85
  jitter_seed_base: 4000
  jitter_lr_factor: [0.8, 1.2]
  jitter_backbone_lr_factor: [0.8, 1.2]
  late_best_window: 3
  extension_epochs: 12
yolo:
  probes:
    enabled: false
    start_iteration: 1
    epochs: 10
    seed_base: 4000
    close_mosaic: 0
    candidates:
      - {name: conservative, lr0: 0.007, lrf: 0.006, weight_decay: 0.001}
      - {name: baseline, lr0: 0.01, lrf: 0.01, weight_decay: 0.0005}
      - {name: aggressive, lr0: 0.014, lrf: 0.016, weight_decay: 0.00025}
  training:
    profile: yolo_customer_comparison_v1
    num_gpus: 4
    epochs: 100
    patience: 20
    imgsz: 640
    batch_size: 32
    nbs: 32
    devices: "0,1,2,3"
    workers: 4
    stage_workers: 16
    optimizer: auto
    lr0: 0.01
    lrf: 0.01
    momentum: 0.9
    weight_decay: 0.0005
    warmup_epochs: 3.0
    amp: true
    deterministic: true
    seed: 0
    close_mosaic: 10
  evaluation:
    imgsz: 640
    batch_size: 64
    workers: 8
    stage_workers: 16
    confidence: 0.001
    iou: 0.7
    max_det: 300
synthesis:
  enabled: false
  pool_dataset_root: null
  defect_spec: null
  routes: {}
  max_neighbors_per_fn: 1
  min_similarity: 0.9
  cumulative_fraction_of_real_defects: 0.25
  amp_model_id: nvidia/Cosmos3-Nano
